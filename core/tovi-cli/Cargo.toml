[package]
name = "tovi-cli"
version = "0.1.0"
edition = "2021"
description = "Headless CLI spike for TOVI"

[dependencies]
tovi-core = { path = "../tovi-core" }
tokio = { version = "1.37", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
qrcode = { version = "0.14", default-features = false } # Terminal QR rendering only
dirs = "7" # Default data directory for the device identity
