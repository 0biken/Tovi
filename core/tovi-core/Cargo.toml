[package]
name = "tovi-core"
version = "0.1.0"
edition = "2021"
description = "Core transfer engine and networking for TOVI"

[dependencies]
# Async runtime
tokio = { version = "1.37", features = ["full"] }

# Networking & Transport (Phase 1 QUIC)
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] } # Match quinn's ring provider; avoids pulling in aws-lc-rs
rcgen = "0.13" # Ephemeral cert generation for P2P QUIC
rustls-webpki = { version = "0.103", default-features = false, features = ["alloc"] } # Read peer cert public key for pinning

# Identity & Crypto
ed25519-dalek = { version = "2.1", features = ["rand_core", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
blake3 = "1.8" # Chunk/file hashing and pairing MAC (decisions.md D5, D2)

# Wire format (decisions.md D6)
serde = { version = "1.0", features = ["derive"] }
ciborium = "0.2"
serde_bytes = "0.11"
base64 = "0.22" # QR pairing URI (decisions.md D3)

# Discovery (Phase 1 mDNS)
mdns-sd = "0.11"
if-addrs = "0.13" # Enumerate local interfaces for QR candidate endpoints (already used by mdns-sd)

# Utilities
anyhow = "1.0"
tracing = "0.1"
fs4 = "1.1" # Free disk space check before accepting a transfer
