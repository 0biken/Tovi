[package]
name = "tovi-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "tovi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tovi-core = { path = "../../../core/tovi-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.22"
dirs = "7"
hostname = "0.4"
mdns-sd = "0.11" # same version as tovi-core
