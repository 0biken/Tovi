name: Rust CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request: # All PRs, including ones stacked on other branches

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check
      
    # The desktop app has its own job below: it needs the frontend built first
    # and, on Linux, the Tauri system libraries
    - name: Run Clippy
      run: cargo clippy --workspace --exclude tovi-desktop --all-targets --all-features -- -D warnings

    - name: Run Tests
      run: cargo test --workspace --exclude tovi-desktop --all-targets --all-features

  desktop:
    name: Desktop app on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install Tauri system libraries
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

    - uses: pnpm/action-setup@v4
      with:
        package_json_file: apps/desktop/package.json

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: apps/desktop/pnpm-lock.yaml

    - name: Build the frontend
      working-directory: apps/desktop
      run: |
        pnpm install --frozen-lockfile
        pnpm build

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - uses: Swatinem/rust-cache@v2

    - name: Run Clippy
      run: cargo clippy -p tovi-desktop --all-targets -- -D warnings

    - name: Run Tests
      run: cargo test -p tovi-desktop --all-targets
